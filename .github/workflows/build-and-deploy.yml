name: Build and Deploy iOS APT Repo

on:
  push:
    branches:
      - main
    paths:
      - "pool/**/*.deb"
      - "repo.toml"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "resources/**"
      - "repo-public.key"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.26"
          cache: true

      - name: Build repotool
        run: go build -trimpath -o repotool ./cmd/repotool

      - name: Run tests
        run: go test -race ./...

      - name: Compute SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: ./repotool build --output _site --dist-output _dist

      # The published tree is a single orphan commit force-pushed to the serving
      # branch: its .deb blobs are already in main's pool/, so git sends only the
      # index. A separate index file keeps the checkout's own index untouched.
      - name: Publish dist branch
        env:
          GIT_INDEX_FILE: ${{ runner.temp }}/dist.index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git --work-tree=_dist add -A -- . ':!.repotool-output'
          commit=$(git commit-tree -m "chore(dist): publish ${GITHUB_SHA}" "$(git write-tree)")
          git push -f origin "${commit}:refs/heads/dist"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
